<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Địa chỉ | TỔ ẤM</title>
<link rel="stylesheet" href="../assets/components.css">
<script src="../assets/app.js" defer></script>
</head>
<body data-role="customer" data-tab="account">
<main class="page narrow">
  <div class="page-head"><div><div class="eyebrow">Tài khoản</div><h1>Sửa địa chỉ</h1></div><div class="row"></div></div>
  <div class="card pad"><div class="form-grid">
    <div class="field full"><label>Tên gợi nhớ</label><input class="input" type="text" value="Nhà" placeholder=""></div>
    <div class="field"><label>Tỉnh / Thành phố</label><select class="select"><option>Thành phố Hồ Chí Minh</option></select></div>
    <div class="field"><label>Phường / Xã</label><select class="select"><option>Phường Sài Gòn</option></select></div>
    <div class="field full"><label>Số nhà, đường</label><input class="input" type="text" value="12 Lê Lợi" placeholder=""></div>
    <div class="field full"><label>Loại nhà</label><div class="row" style="gap:8px"><a class="chip on">Chung cư</a><a class="chip">Nhà phố</a><a class="chip">Phòng trọ</a></div></div>
    <div class="field"><label>Diện tích mỗi tầng (m²)</label><input class="input" type="text" value="29" placeholder=""></div><div class="field"><label>Số tầng</label><input class="input" type="text" value="2" placeholder=""></div>
    <div class="full banner info"><span class="ms">straighten</span><div><b class="tnum">29 m² × 2 tầng = 58 m²</b> · Khung giá 31–80 m²</div></div>
  </div>
  <div class="row mt-24" style="justify-content:flex-end"><a class="btn outline" href="addresses.html">Hủy</a><a class="btn" href="addresses.html">Lưu địa chỉ</a></div></div>
</main>
</body>
</html>
