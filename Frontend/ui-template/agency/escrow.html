<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Ký quỹ và SLA | TỔ ẤM</title>

<body data-role="agency" data-tab="escrow" data-crumb="Ký quỹ & SLA">

      <div class="field"><label>Số tiền (đ)</label><input class="input tnum" placeholder="5.000.000"></div>

        <tr><td class="tnum">#921</td><td>Nạp ký quỹ</td><td class="num" style="color:var(--primary)">+5.000.000</td><td></td></tr>
        <tr><td class="tnum">#918</td><td>Phạt vắng mặt · ca #4710</td><td class="num" style="color:var(--error)">−300.000</td><td class="r"><a class="btn outline sm">Khiếu nại</a></td></tr>
        <tr><td class="tnum">#902</td><td>Nạp ký quỹ</td><td class="num" style="color:var(--primary)">+10.000.000</td><td></td></tr>
      </tbody></table></div></div>
  </div>
  <div class="card pad mt-16"><div class="head"><h2>Khiếu nại khoản #918</h2><a>Đóng</a></div>
    <div class="field"><textarea class="textarea" rows="3" placeholder="Lý do khiếu nại (tối đa 500 ký tự)"></textarea></div>
    <div class="row mt-16" style="justify-content:flex-end"><a class="btn">Gửi khiếu nại</a></div></div></main>
