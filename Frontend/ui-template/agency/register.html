<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký đối tác | TỔ ẤM</title>
<link rel="stylesheet" href="../assets/components.css">
<script src="../assets/app.js" defer></script>
</head>
<body>
<div class="auth">
  <div class="visual" style="background-image:url(https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1400&q=70)">
    <a class="brand" href="../index.html"><span class="mark"><span class="ms">home</span></span>TỔ ẤM</a>
    <div><h2>Mở rộng doanh thu với đội thợ của bạn.</h2><p style="margin-top:12px;color:rgba(255,255,255,.8);max-width:420px">Đăng ký công ty, nộp cam kết bảo lãnh và bắt đầu nhận ca trên TỔ ẤM.</p></div></div>
  <div class="formside" style="align-items:start;padding-top:56px"><div class="box" style="max-width:520px">
    <h1>Đăng ký đối tác doanh nghiệp</h1><p>Điền thông tin theo hồ sơ pháp lý của công ty.</p>
    <div class="form-grid mt-24">
      <div class="field full"><label>Mã số thuế</label><input class="input" type="text" value="" placeholder=""><span class="hint">10 chữ số, hoặc 10 chữ số-3 chữ số cho chi nhánh</span></div>
      <div class="field full"><label>Tên pháp lý của công ty</label><input class="input" type="text" value="" placeholder=""></div>
      <div class="field full"><label>Người đại diện pháp luật</label><input class="input" type="text" value="" placeholder=""></div>
      <div class="field"><label>Số điện thoại liên hệ</label><input class="input" type="text" value="" placeholder=""></div><div class="field"><label>Email (dùng để đăng nhập)</label><input class="input" type="email" value="" placeholder=""></div>
      <div class="field full"><label>Mật khẩu</label><input class="input" type="password" value="" placeholder=""></div>
      <div class="field"><label>Ngân hàng</label><input class="input" type="text" value="" placeholder=""></div><div class="field"><label>Số tài khoản</label><input class="input" type="text" value="" placeholder=""><span class="hint">6 đến 30 chữ số</span></div>
    </div>
    <a class="btn lg block mt-24" href="login.html">Đăng ký</a>
    <p class="sm muted mt-16">Đã có tài khoản? <a class="link" href="login.html">Đăng nhập</a></p>
  </div></div>
</div>
</body>
</html>
