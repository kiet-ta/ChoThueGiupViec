<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mã OTP</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/components.css">
<script src="../assets/app.js"></script>
<style>
  .otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .otp div { height: 60px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; font-size: 24px; font-weight: 700; }
  .otp div.f { border: 2px solid var(--primary); }
</style>
</head>
<body>
<!-- /auth/otp-verify · OTP 6 digits, valid 5 min, 5 tries, resend cooldown 60 s (decision Q06) -->
<div class="phone has-btnbar">
  <main class="screen">
    <div class="appbar"><a href="phone.html" class="icon-btn"><span class="ms">arrow_back</span></a><span class="title"></span><span class="icon-btn"></span></div>
    <div class="h2 mt" style="font-size:26px">Nhập mã</div>
    <div class="muted mt-xs tnum">Đã gửi tới +84 912 345 678</div>
    <div class="otp mt-lg tnum"><div>4</div><div>8</div><div>2</div><div>1</div><div class="f"></div><div></div></div>
    <div class="row between mt">
      <span class="muted small">Gửi lại sau <b class="tnum" style="color:var(--text)">0:42</b></span>
      <span class="muted small tnum">Còn 4/5 lần thử</span>
    </div>
  </main>
  <div class="btn-bar"><a id="next" href="../customer/home.html" class="btn block">Xác nhận</a></div>
</div>
<script>
  // A new worker fills the profile first; after it the worker signs in again (the registration answer has no tokens).
  const q = location.search;
  if (q.includes("again")) document.getElementById("next").href = "../worker/today.html";
  else if (q.includes("worker")) document.getElementById("next").href = "register.html";
</script>
</body>
</html>
