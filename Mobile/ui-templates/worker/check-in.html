<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker · Check-in</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/components.css">
<script src="../assets/app.js"></script>
</head>
<body>
<!-- /dispatch/check-in · POST /api/dispatch/assignments/{id}/check-in, accepted within 100 m. Not drawn: the "Vị trí chưa khớp"
     state, where the worker sends a house-plate photo instead (POST .../check-in/plate-photo). -->
<div class="phone has-btnbar">
  <main class="screen">
    <div class="appbar"><a href="job.html" class="icon-btn"><span class="ms">arrow_back</span></a><span class="title">Check-in</span><span class="icon-btn"></span></div>

    <!-- Distance diagram: 100 m radius around the address, worker position inside -->
    <div class="map" style="height:300px">
      <svg viewBox="0 0 350 300" width="100%" height="300" preserveAspectRatio="xMidYMid slice">
        <path d="M0 210 L350 150 M90 0 L140 300 M270 0 L240 300 M0 60 L350 40" stroke="#fff" stroke-width="12"/>
        <circle cx="185" cy="150" r="110" fill="var(--primary)" fill-opacity=".08" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="5 5"/>
        <line x1="185" y1="150" x2="222" y2="130" stroke="var(--primary)" stroke-width="2"/>
        <circle cx="185" cy="150" r="9" fill="var(--primary)" stroke="#fff" stroke-width="3"/>
        <circle cx="222" cy="130" r="9" fill="var(--amber)" stroke="#fff" stroke-width="3"/>
        <text x="210" y="160" class="axis" style="font-size:12px;font-weight:700;fill:var(--text)">38 m</text>
        <text x="185" y="34" text-anchor="middle" style="font-size:11px;fill:var(--text-2);font-family:var(--font-body)">bán kính 100 m</text>
      </svg>
    </div>
    <div class="legend mt-sm"><span><i style="background:var(--primary)"></i>Địa chỉ</span><span><i style="background:var(--amber)"></i>Bạn</span></div>

    <div class="grid2 mt">
      <div class="stat"><div class="label"><span class="ms">straighten</span>Khoảng cách</div><div class="num m">38 <span style="font-size:15px">m</span></div><div class="bar mt-sm"><i style="width:38%"></i></div></div>
      <div class="stat"><div class="label"><span class="ms">gps_fixed</span>Kết quả</div><div class="mt-sm"><span class="pill ok"><span class="dot"></span>Trong vùng</span></div><div class="xs muted mt-sm">≤ 100 m</div></div>
    </div>
  </main>
  <div class="btn-bar"><a href="execution.html" class="btn block">Bắt đầu ca làm</a></div>
</div>
</body>
</html>
