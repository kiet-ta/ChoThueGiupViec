<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker · Việc hiện tại</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/components.css">
<script src="../assets/app.js"></script>
</head>
<body data-role="worker" data-tab="job">
<!-- Center tab (new): the pending offer or the current assignment. Needs API: "my assignments" does not exist yet
     (today a job is reachable only from the accept result). Chain: check-in → execution → photos → submit-completion. -->
<div class="phone">
  <main class="screen">
    <div class="appbar large"><span class="title">Việc hiện tại</span><a href="offer.html" class="pill warn"><span class="dot"></span>1 lời mời</a></div>

    <div class="card">
      <div class="row between">
        <div><div class="num l">13:00</div><div class="muted small mt-xs">CN 25/10 · → 17:00</div></div>
        <div style="text-align:right"><div class="num s">208.000 đ</div><div class="xs muted mt-xs">thực nhận</div></div>
      </div>
      <div class="divider"></div>
      <div class="steps">
        <div class="st now"><span class="d"><span class="ms">near_me</span></span>Check-in</div>
        <div class="st"><span class="d"><span class="ms">cleaning_services</span></span>Làm</div>
        <div class="st"><span class="d"><span class="ms">photo_camera</span></span>Ảnh</div>
        <div class="st"><span class="d"><span class="ms">done_all</span></span>Nghiệm thu</div>
      </div>
    </div>

    <div class="map mt" style="height:150px">
      <svg viewBox="0 0 350 150" width="100%" height="150" preserveAspectRatio="xMidYMid slice">
        <path d="M0 100 L350 60 M100 0 L150 150 M260 0 L230 150" stroke="#fff" stroke-width="10"/>
        <path d="M70 130 C 120 110, 150 90, 200 70" stroke="var(--primary)" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
        <circle cx="70" cy="130" r="6" fill="var(--text-2)" stroke="#fff" stroke-width="2"/>
        <circle cx="200" cy="70" r="8" fill="var(--primary)" stroke="#fff" stroke-width="3"/>
      </svg>
    </div>
    <div class="grid3 mt">
      <div class="stat center"><div class="num s">2,4</div><div class="xs muted mt-sm">km</div></div>
      <div class="stat center"><div class="num s">58</div><div class="xs muted mt-sm">m²</div></div>
      <div class="stat center"><div class="num s">4</div><div class="xs muted mt-sm">giờ</div></div>
    </div>
    <div class="row mt muted small"><span class="ms sm">location_on</span>Phường Sài Gòn · Economy</div>

    <a href="check-in.html" class="btn block mt-lg"><span class="ms">near_me</span>Đến nơi &amp; Check-in</a>
    <div class="row mt" style="gap:10px">
      <a href="customer-absent.html" class="btn ghost sm" style="flex:1">Khách vắng</a>
      <a href="incident.html" class="btn ghost sm" style="flex:1">Báo sự cố</a>
    </div>
  </main>
</div>
</body>
</html>
