<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker · Đánh giá khách</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/components.css">
<script src="../assets/app.js"></script>
<style>
  .bigstars { display: flex; justify-content: center; gap: 6px; color: var(--amber); }
  .bigstars .ms { font-size: 42px; }
  .crit { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
  .crit + .crit { border-top: 1px solid var(--border); }
  .crit .stars .ms { font-size: 22px; }
  .stars .off { color: var(--surface-dim); }
</style>
</head>
<body>
<!-- /ratings · RatingScreenArgs(worker, assignmentId). GET /api/workers/me/assignments/{id}/rating-window. Worker criteria: cooperation, workingConditions. 48 h window, comment ≤ 500. -->
<div class="phone has-btnbar">
  <main class="screen">
    <div class="appbar"><a href="income.html" class="icon-btn"><span class="ms">close</span></a><span class="title">Đánh giá khách</span><span class="icon-btn"></span></div>

    <div class="center">
      <div class="h2">Ca 25/10 · 13:00</div>
      <div class="row mt-sm" style="justify-content:center;gap:6px"><span class="ms sm muted">timer</span><span class="small muted tnum">Còn 47:30:12</span></div>
    </div>

    <div class="bigstars mt-lg">
      <span class="ms fill">star</span><span class="ms fill">star</span><span class="ms fill">star</span><span class="ms fill">star</span><span class="ms fill">star</span>
    </div>

    <div class="card mt-lg" style="padding:4px 16px">
      <div class="crit"><span class="h3">Hợp tác</span><span class="stars"><span class="ms fill">star</span><span class="ms fill">star</span><span class="ms fill">star</span><span class="ms fill">star</span><span class="ms fill">star</span></span></div>
      <div class="crit"><span class="h3">Điều kiện làm việc</span><span class="stars"><span class="ms fill">star</span><span class="ms fill">star</span><span class="ms fill">star</span><span class="ms fill">star</span><span class="ms off">star</span></span></div>
    </div>

    <div class="input area mt"><span class="ph">Nhận xét (không bắt buộc)</span></div>
    <div class="hint mt-xs" style="text-align:right">0/500</div>
  </main>
  <div class="btn-bar"><a href="income.html" class="btn block">Gửi đánh giá</a></div>
</div>
</body>
</html>
