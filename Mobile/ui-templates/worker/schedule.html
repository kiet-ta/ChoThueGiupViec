<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker · Lịch</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/components.css">
<script src="../assets/app.js"></script>
<style>
  .days { display: flex; gap: 6px; }
  .day { flex: 1; height: 64px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .day b { font-size: 16px; } .day span { font-size: 10px; color: var(--text-2); }
  .day.on { background: var(--primary); border-color: var(--primary); color: #fff; } .day.on span { color: rgba(255,255,255,.75); }
  .dots { display: flex; gap: 2px; } .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--surface-dim); }
  .dots i.a { background: var(--primary-container); } .day.on .dots i.a { background: #fff; }
</style>
</head>
<body data-role="worker" data-tab="schedule">
<!-- /workers/slots · GET /api/workers/me/slots, POST /api/workers/me/slots/toggle; switching a slot ON also sends PUT /api/workers/me/location (D19).
     A BOOKED / HELD slot cannot be toggled. Agency staff get 403: their schedule is the agency roster. -->
<div class="phone">
  <main class="screen">
    <div class="appbar large"><span class="title">Lịch rảnh</span><a href="agency-roster.html" class="btn ghost sm">Lịch công ty</a></div>

    <div class="grid3">
      <div class="stat center"><div class="num m">9</div><div class="xs muted mt-sm">Ca bật</div></div>
      <div class="stat center"><div class="num m">6</div><div class="xs muted mt-sm">Có việc</div></div>
      <div class="stat center"><div class="num m">67<span style="font-size:14px">%</span></div><div class="xs muted mt-sm">Lấp đầy</div></div>
    </div>

    <div class="row between mt-lg"><span class="caps">26/10 – 01/11</span><span class="row" style="gap:4px"><span class="icon-btn outlined" style="width:32px;height:32px"><span class="ms sm">chevron_left</span></span><span class="icon-btn outlined" style="width:32px;height:32px"><span class="ms sm">chevron_right</span></span></span></div>
    <div class="days mt-sm tnum">
      <div class="day on"><span>T2</span><b>26</b><span class="dots"><i class="a"></i><i class="a"></i><i></i></span></div>
      <div class="day"><span>T3</span><b>27</b><span class="dots"><i class="a"></i><i></i><i class="a"></i></span></div>
      <div class="day"><span>T4</span><b>28</b><span class="dots"><i></i><i class="a"></i><i></i></span></div>
      <div class="day"><span>T5</span><b>29</b><span class="dots"><i></i><i class="a"></i><i class="a"></i></span></div>
      <div class="day"><span>T6</span><b>30</b><span class="dots"><i class="a"></i><i class="a"></i><i></i></span></div>
      <div class="day"><span>T7</span><b>31</b><span class="dots"><i></i><i></i><i></i></span></div>
      <div class="day"><span>CN</span><b>01</b><span class="dots"><i></i><i></i><i></i></span></div>
    </div>

    <div class="list mt">
      <div class="item">
        <span class="lead-icon"><span class="ms">wb_sunny</span></span>
        <div class="grow"><div class="h3 tnum">08:00 – 12:00</div><div class="small muted">Sáng</div></div>
        <span class="pill ok"><span class="ms sm">lock</span>Có việc</span>
      </div>
      <div class="item">
        <span class="lead-icon"><span class="ms">light_mode</span></span>
        <div class="grow"><div class="h3 tnum">13:00 – 17:00</div><div class="small muted">Chiều</div></div>
        <span class="switch on"></span>
      </div>
      <div class="item">
        <span class="lead-icon"><span class="ms">bedtime</span></span>
        <div class="grow"><div class="h3 tnum">17:30 – 20:30</div><div class="small muted">Tối</div></div>
        <span class="switch"></span>
      </div>
    </div>
  </main>
</div>
</body>
</html>
