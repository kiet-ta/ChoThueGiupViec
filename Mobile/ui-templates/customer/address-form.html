<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer · Địa chỉ</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/components.css">
<script src="../assets/app.js"></script>
</head>
<body>
<!-- /addresses/form · province then ward picker (34 provinces, 3,321 wards since 2025-07-01, no district level),
     GPS picker (default District 1, HCMC), area calculator card. -->
<div class="phone has-btnbar">
  <main class="screen">
    <div class="appbar"><a href="addresses.html" class="icon-btn"><span class="ms">arrow_back</span></a><span class="title">Địa chỉ</span><span class="icon-btn"></span></div>

    <div class="map" style="height:150px">
      <svg viewBox="0 0 350 150" width="100%" height="150" preserveAspectRatio="xMidYMid slice">
        <path d="M0 100 L350 60 M100 0 L150 150 M260 0 L230 150 M0 30 L350 20" stroke="#fff" stroke-width="10"/>
        <circle cx="175" cy="75" r="26" fill="var(--primary)" opacity=".12"/>
        <circle cx="175" cy="75" r="8" fill="var(--primary)" stroke="#fff" stroke-width="3"/>
      </svg>
      <span class="icon-btn outlined" style="position:absolute;right:10px;bottom:10px"><span class="ms">my_location</span></span>
    </div>

    <div class="col mt-lg" style="gap:14px">
      <div class="field"><label>Tên gợi nhớ</label><div class="input">Nhà</div></div>
      <div class="grid2">
        <div class="field"><label>Tỉnh / Thành phố</label><div class="input"><span class="grow ellipsis">Thành phố Hồ Chí Minh</span><span class="ms">expand_more</span></div></div>
        <div class="field"><label>Phường / Xã</label><div class="input"><span class="grow ellipsis">Phường Sài Gòn</span><span class="ms">expand_more</span></div></div>
      </div>
      <div class="field"><label>Số nhà, đường</label><div class="input">12 Lê Lợi</div></div>
    </div>

    <div class="caps mt-lg">Loại nhà</div>
    <div class="seg mt-sm"><span>Chung cư</span><span class="on">Nhà phố</span><span>Phòng trọ</span></div>

    <div class="caps mt-lg">Diện tích</div>
    <div class="card mt-sm">
      <!-- totalAreaM2 = floorAreaM2 × numFloors (server is canonical) -->
      <div class="row tnum" style="gap:10px;align-items:baseline">
        <span class="h3">29 m²</span><span class="muted">×</span><span class="h3">2 tầng</span><span class="muted">=</span>
        <span class="grow"></span><span class="num l">58 <span style="font-size:18px">m²</span></span>
      </div>
      <div class="row between mt-sm"><span class="small muted">Khung giá</span><span class="pill">31–80 m²</span></div>
      <!-- area bracket scale -->
      <div class="row mt" style="gap:3px">
        <i style="flex:30;height:6px;border-radius:3px;background:var(--surface-container)"></i>
        <i style="flex:50;height:6px;border-radius:3px;background:var(--primary)"></i>
        <i style="flex:40;height:6px;border-radius:3px;background:var(--surface-container)"></i>
      </div>
      <div class="row between mt-xs xs muted tnum"><span>0</span><span>30</span><span>80</span><span>120+</span></div>
    </div>
  </main>
  <div class="btn-bar"><a href="addresses.html" class="btn block">Lưu</a></div>
</div>
</body>
</html>
