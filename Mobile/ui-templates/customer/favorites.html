<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer · Yêu thích</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/components.css">
<script src="../assets/app.js"></script>
</head>
<body data-role="customer" data-tab="favorites">
<!-- /customer/favorites · FavoriteWorker: fullName, ratingAvg, completedJobs, workStatus, addedAt. -->
<div class="phone">
  <main class="screen">
    <div class="appbar large"><span class="title">Yêu thích</span><span class="muted tnum">3 thợ</span></div>

    <div class="card">
      <div class="row">
        <span class="avatar lg">HT</span>
        <div class="grow">
          <div class="h2">Hà Trần</div>
          <div class="mt-xs"><span class="pill ok"><span class="dot"></span>Đang hoạt động</span></div>
        </div>
        <span class="ms fill" style="color:var(--primary)">favorite</span>
      </div>
      <div class="grid2 mt">
        <div class="stat" style="padding:12px"><div class="num m">4.9</div><div class="stars mt-sm"><span class="ms fill">star</span><span class="ms fill">star</span><span class="ms fill">star</span><span class="ms fill">star</span><span class="ms fill">star</span></div></div>
        <div class="stat" style="padding:12px"><div class="num m">126</div><div class="xs muted mt-sm">ca hoàn tất</div></div>
      </div>
    </div>

    <div class="list mt">
      <div class="item">
        <span class="avatar">MN</span>
        <div class="grow"><div class="h3">Mai Nguyễn</div><div class="small muted tnum">★ 4.8 · 88 ca</div></div>
        <span class="ms fill" style="color:var(--primary)">favorite</span>
      </div>
      <div class="item">
        <span class="avatar">TL</span>
        <div class="grow"><div class="h3">Thu Lê</div><div class="small muted tnum">★ 4.7 · 41 ca</div></div>
        <span class="ms fill" style="color:var(--primary)">favorite</span>
      </div>
    </div>
  </main>
</div>
</body>
</html>
