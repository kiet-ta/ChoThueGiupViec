# UAT stack: SQL Server + migrations + Valhalla (routing) + backend (Development) + Web. `docker compose up --build`, then http://localhost:8080.
# The dev-only SA password has a default; override it with docker/uat.env.example copied to docker/uat.env (--env-file docker/uat.env).
name: giupviec-uat

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Uat_Passw0rd!2026}
      MSSQL_PID: Developer
    ports:
      - "${DB_HOST_PORT:-14330}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 2g
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  migrate:
    build:
      context: ./Backend
      target: migrate
    environment:
      CONNECTION: "Server=db;Database=ChoThueGiupViec;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Uat_Passw0rd!2026};TrustServerCertificate=True;"
    deploy:
      resources:
        limits:
          memory: 2g
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Routing engine for the route maps (ROUTE-WEB-01, ROUTE-MOB-01). Tiles are built once from an OpenStreetMap extract of Vietnam that you put in
  # the volume (see scripts/uat/UAT.md, "Route maps"); without it the stack still starts and the route endpoints answer 502.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    environment:
      server_threads: "4"
      use_tiles_ignore_pbf: "True"   # reuse the built tiles on later starts
      build_tar: "True"
      serve_tiles: "True"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      build_transit: "False"
    volumes:
      - valhalla_data:/custom_files
    ports:
      - "${VALHALLA_HOST_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8002/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      target: runtime
    environment:
      # Development: the dev admin is seeded (Seed:Admin:* of appsettings.Development.json), the OTP is written to the log, payments are Fake.
      ASPNETCORE_ENVIRONMENT: Development
      # Inside the container `localhost` is the container itself, so appsettings.Development.json (localhost:8002) cannot reach Valhalla.
      Valhalla__BaseUrl: "http://valhalla:8002"
      ConnectionStrings__DefaultConnection: "Server=db;Database=ChoThueGiupViec;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Uat_Passw0rd!2026};TrustServerCertificate=True;"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OpenTelemetry__Otlp__Endpoint: "http://tempo:4317"
      OpenTelemetry__ServiceName: "ChoThueGiupViec-Backend"
    deploy:
      resources:
        limits:
          memory: 2g
    mem_limit: 2g
    depends_on:
      migrate:
        condition: service_completed_successfully
      valhalla:
        condition: service_started   # not service_healthy: the first tile build takes a long time and the stack must start without it
    ports:
      - "5004:5004"

  web:
    build:
      context: ./Frontend
    deploy:
      resources:
        limits:
          memory: 2g
    mem_limit: 2g
    depends_on:
      - backend
    ports:
      - "${WEB_HOST_PORT:-8080}:80"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: giupviec-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--enable-feature=exemplar-storage'
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    deploy:
      resources:
        limits:
          memory: 1g
    mem_limit: 1g
    depends_on:
      - backend

  tempo:
    image: grafana/tempo:2.6.1
    container_name: giupviec-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo   # owned by the image user (uid 10001)
    ports:
      - "${TEMPO_HOST_PORT:-3200}:3200"
      # OTLP; the backend reaches tempo:4317 inside the network. Override if the host port is taken (e.g. the dev stack's Jaeger).
      - "${TEMPO_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${TEMPO_OTLP_HTTP_HOST_PORT:-4318}:4318"
    deploy:
      resources:
        limits:
          memory: 1g
    mem_limit: 1g

  loki:
    image: grafana/loki:3.2.1
    container_name: giupviec-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./docker/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki   # owned by the image user (uid 10001)
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    deploy:
      resources:
        limits:
          memory: 1g
    mem_limit: 1g

  grafana:
    image: grafana/grafana:11.3.0
    container_name: giupviec-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 1g
    mem_limit: 1g
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  sqldata:
  valhalla_data:
    name: valhalla_data   # fixed name: the tiles (long to build) survive `docker compose down -v` of other stacks and are reused
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
